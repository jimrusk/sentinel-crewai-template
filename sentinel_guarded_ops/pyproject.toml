[project]
name = "sentinel_guarded_ops"
version = "0.1.0"
description = "Sentinel Guarded Ops: a CrewAI crew whose every consequential action passes through Sentinel, Aridon's pre-execution authorization layer (allow / hold-for-human / deny, SHA-256 hash-chained audit)."
authors = [{ name = "Aridon", email = "evaaridon@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.0,<2.0.0"
]

[project.scripts]
sentinel_guarded_ops = "sentinel_guarded_ops.main:run"
run_crew = "sentinel_guarded_ops.main:run"
train = "sentinel_guarded_ops.main:train"
replay = "sentinel_guarded_ops.main:replay"
test = "sentinel_guarded_ops.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
